name: Build NYKISS APK

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build release APK
        run: |
          ./gradlew :TMessagesProj_App:assembleAfatRelease \
            --no-daemon --stacktrace
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          GRADLE_OPTS: -Xmx6g -XX:MaxMetaspaceSize=1g

      - name: Find APK
        id: find_apk
        run: |
          APK=$(find . -name "*afat*release*.apk" -not -path "*/obj/*" | head -1)
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          echo "Found APK: $APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nykiss-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/master' && steps.find_apk.outputs.apk_path != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: NYKISS v${{ github.run_number }}
          body: |
            NYKISS — Ghost Mode + Anti-Recall
            Build ${{ github.run_number }} · commit ${{ github.sha }}

            **Установка:** Скачай APK → Settings → Unknown Sources → Install
          files: ${{ steps.find_apk.outputs.apk_path }}
          token: ${{ secrets.GITHUB_TOKEN }}
