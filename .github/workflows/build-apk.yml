name: Build NYKISS APK

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Free disk space
        run: |
          sudo apt-get remove -y '^llvm-.*' 'php.*' '^mongodb-.*' '^mysql-.*' azure-cli firefox mono-devel libgl1-mesa-dri || true
          sudo apt-get autoremove -y
          sudo apt-get clean
          sudo rm -rf /usr/share/dotnet/ /usr/local/graalvm/ /usr/local/.ghcup/ \
                      /usr/local/share/powershell /usr/local/share/chromium \
                      /usr/local/lib/node_modules
          df -h

      - name: Install build tools
        run: sudo apt-get install -y bison gcc make curl ninja-build ccache

      - name: Checkout with all submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ccache
          restore-keys: ccache
          max-size: 5G

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build release APK
        run: ./gradlew :TMessagesProj_App:assembleAfatRelease --no-daemon
        env:
          GRADLE_OPTS: -Xmx6g -XX:MaxMetaspaceSize=1g
          CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
          CCACHE_NOHASHDIR: "true"
          CCACHE_HARDLINK: "true"

      - name: Find APK
        id: find_apk
        run: |
          APK=$(find . -name "*afat*release*.apk" -not -path "*/obj/*" | head -1)
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          echo "Found: $APK"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nykiss-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/master' && steps.find_apk.outputs.apk_path != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: NYKISS v${{ github.run_number }}
          body: |
            NYKISS — Ghost Mode + Anti-Recall
            Build ${{ github.run_number }} · ${{ github.sha }}

            **Установка:** Скачай APK → Настройки → Неизвестные источники → Установить
          files: ${{ steps.find_apk.outputs.apk_path }}
          token: ${{ secrets.GITHUB_TOKEN }}
