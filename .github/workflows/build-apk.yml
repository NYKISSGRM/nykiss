name: Build NYKISS APK

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout (no submodules)
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Init required submodules only
        run: |
          git submodule init TMessagesProj_Modules/media
          git submodule init TMessagesProj/lib/jlatexmath
          git submodule update --depth=1 TMessagesProj_Modules/media
          git submodule update --depth=1 TMessagesProj/lib/jlatexmath

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Init JNI submodules (native build)
        run: |
          git submodule init TMessagesProj/jni/tlottie
          git submodule init TMessagesProj/jni/third_party/absl
          git submodule init TMessagesProj/jni/third_party/dav1d
          git submodule init TMessagesProj/jni/third_party/openh264
          git submodule init TMessagesProj/jni/third_party/xiph/ogg
          git submodule init TMessagesProj/jni/third_party/xiph/opus
          git submodule init TMessagesProj/jni/third_party/xiph/opusfile
          git submodule update --depth=1 \
            TMessagesProj/jni/tlottie \
            TMessagesProj/jni/third_party/absl \
            TMessagesProj/jni/third_party/dav1d \
            TMessagesProj/jni/third_party/openh264 \
            TMessagesProj/jni/third_party/xiph/ogg \
            TMessagesProj/jni/third_party/xiph/opus \
            TMessagesProj/jni/third_party/xiph/opusfile

      - name: Init large JNI submodules
        run: |
          git submodule init TMessagesProj/jni/third_party/boringssl
          git submodule init TMessagesProj/jni/third_party/ffmpeg
          git submodule init TMessagesProj/jni/third_party/libvpx
          git submodule init TMessagesProj/jni/third_party/libyuv
          git submodule update --depth=1 \
            TMessagesProj/jni/third_party/boringssl \
            TMessagesProj/jni/third_party/ffmpeg \
            TMessagesProj/jni/third_party/libvpx \
            TMessagesProj/jni/third_party/libyuv

      - name: Build release APK
        run: |
          ./gradlew :TMessagesProj_App:assembleAfatRelease \
            --no-daemon --stacktrace
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_ROOT }}
          GRADLE_OPTS: -Xmx6g -XX:MaxMetaspaceSize=1g

      - name: Find APK
        id: find_apk
        run: |
          APK=$(find . -name "*afat*release*.apk" -not -path "*/obj/*" | head -1)
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          echo "Found APK: $APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nykiss-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/master' && steps.find_apk.outputs.apk_path != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: NYKISS v${{ github.run_number }}
          body: |
            NYKISS — Ghost Mode + Anti-Recall
            Build ${{ github.run_number }} · commit ${{ github.sha }}

            **Установка:** Скачай APK → Настройки → Неизвестные источники → Установить
          files: ${{ steps.find_apk.outputs.apk_path }}
          token: ${{ secrets.GITHUB_TOKEN }}
