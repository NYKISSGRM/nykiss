name: Build NYKISS APK

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Write google-services.json
        run: |
          mkdir -p TMessagesProj/src/afat
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > TMessagesProj/src/afat/google-services.json
          mkdir -p TMessagesProj/src/main
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > TMessagesProj/src/main/google-services.json

      - name: Write keystore
        run: |
          echo '${{ secrets.KEYSTORE_BASE64 }}' | base64 -d > nykiss.keystore

      - name: Build release APK
        run: |
          ./gradlew :TMessagesProj:assembleAfatRelease \
            -PAPP_ID=${{ secrets.TELEGRAM_APP_ID }} \
            -PAPP_HASH=${{ secrets.TELEGRAM_APP_HASH }} \
            -PKEYSTORE_PATH=${{ github.workspace }}/nykiss.keystore \
            -PKEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }} \
            -PKEY_ALIAS=${{ secrets.KEY_ALIAS }} \
            -PKEY_PASSWORD=${{ secrets.KEY_PASSWORD }} \
            --no-daemon --stacktrace
        env:
          GRADLE_OPTS: -Xmx4g -XX:MaxMetaspaceSize=512m

      - name: Find APK
        id: find_apk
        run: |
          APK=$(find . -name "*release*.apk" -not -path "*/obj/*" | head -1)
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          echo "Found APK: $APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nykiss-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 14

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: NYKISS v${{ github.run_number }}
          body: |
            NYKISS — Ghost Mode + Anti-Recall
            Build ${{ github.run_number }} • ${{ github.sha }}
          files: ${{ steps.find_apk.outputs.apk_path }}
          token: ${{ secrets.GITHUB_TOKEN }}
